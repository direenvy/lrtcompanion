# Render blueprint — defines the backend web service.
# Render reads this on connect; you still set the SECRET env vars in the
# dashboard (never commit those). See README for the full list.

services:
  - type: web
    name: lrt-companion-api
    runtime: python
    plan: free                      # upgrade to "starter" to stop the 15-min sleep
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true                # redeploy on every push to the connected branch
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Force Groq for STT — Render has no GPU, so local Whisper would be unusable.
      - key: WHISPER_BACKEND
        value: groq
      # ── Secrets — set these in the Render dashboard, do NOT hard-code ──
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # X polling runs ONLY here (24/7 host), not on the laptop — set the token
      # in the dashboard to enable it. Leave unset to disable polling.
      - key: X_BEARER_TOKEN
        sync: false
      # Comma-separated production frontends allowed by CORS. Fill in the Vercel
      # URL after that deploy (e.g. https://fyp-lrt.vercel.app).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
